<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت سفارش‌ها و کدهای پرو | آناناس (AnanasAI)</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- اضافه شدن اسکریپت کپچای گوگل -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <style>
    * { font-family: 'Vazirmatn', sans-serif; }
    body { background-color: #0b0f17; color: #f3f4f6; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0b0f17; }
    ::-webkit-scrollbar-thumb { background: #232f46; border-radius: 9999px; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 py-8">

  <!-- کادر ورود به پنل ادمین -->
  <div id="loginBox" class="bg-[#151c28] border border-[#232f46] p-6 rounded-2xl max-w-sm w-full space-y-5 shadow-2xl">
    <div class="text-center space-y-1">
      <span class="text-3xl">🍍</span>
      <h2 class="text-lg font-bold text-white">ورود به پنل مدیریت آناناس</h2>
      <p class="text-xs text-gray-400">برای ورود، رمز عبور را وارد کرده و کپچا را حل کنید</p>
    </div>
    
    <input id="adminPassInput" type="password" onkeydown="if(event.key==='Enter') checkLogin()" placeholder="رمز عبور ادمین" class="w-full bg-[#0b0f17] border border-[#232f46] rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-amber-500 text-white transition">
    
    <!-- ابزارک ریکپچا (تاریک) -->
    <div class="flex justify-center my-2">
      <!-- مهم: کلید Site Key خود را در فیلد data-sitekey قرار دهید -->
      <div class="g-recaptcha" data-sitekey="6LfdaBguAAAAAHqXZ_i3PTLxmN-pT2z-hJHtMz_v" data-theme="dark"></div>
    </div>

    <button onclick="checkLogin()" class="w-full bg-amber-500 hover:bg-amber-400 text-black font-bold py-2.5 rounded-xl text-sm transition shadow-lg shadow-amber-500/20 cursor-pointer">بررسی و ورود</button>
  </div>

  <!-- محتوای اصلی پنل ادمین (بدون تغییرات ظاهری نسبت به قبل) -->
  <div id="panelBox" class="hidden bg-[#151c28] border border-[#232f46] p-5 sm:p-7 rounded-3xl max-w-4xl w-full space-y-8 shadow-2xl">
    
    <!-- هدر پنل -->
    <div class="flex flex-wrap items-center justify-between gap-3 border-b border-[#232f46] pb-4">
      <div class="flex items-center gap-2.5">
        <span class="text-2xl">🍍</span>
        <div>
          <h2 class="font-extrabold text-white text-base sm:text-lg">مدیریت واریزی‌ها و کدهای پرو (AnanasAI)</h2>
          <p class="text-[11px] text-gray-400">بررسی فیش‌های ثبت‌شده از صفحه خرید و صدور کد ۳۰ روزه</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="loadAdminData()" class="px-3.5 py-2 rounded-xl bg-[#0b0f17] border border-[#232f46] hover:border-amber-500/50 text-xs text-amber-400 font-bold flex items-center gap-1.5 transition cursor-pointer"><span>🔄 بروزرسانی اطلاعات</span></button>
        <button onclick="adminLogout()" class="px-3.5 py-2 rounded-xl bg-rose-500/10 border border-rose-500/30 hover:bg-rose-500/20 text-xs text-rose-300 font-bold transition cursor-pointer">خروج امن</button>
      </div>
    </div>

    <!-- بخش ۱: لیست درخواست‌های پرداخت -->
    <div class="space-y-3">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-extrabold text-white flex items-center gap-2">
          <span>💳</span>
          <span>فیش‌های واریزی ثبت‌شده (صفحه Buy)</span>
          <span id="pendingCountBadge" class="px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-400 border border-rose-500/30 text-[11px]">0 در انتظار</span>
        </h3>
      </div>
      <div id="paymentList" class="max-h-96 overflow-y-auto border border-[#232f46] rounded-2xl p-3 space-y-2.5 bg-[#0b0f17]/60"></div>
    </div>

    <!-- بخش ۲: ساخت دستی کد رندوم جدید -->
    <div class="space-y-2 pt-2 border-t border-[#232f46]">
      <label class="block text-xs font-bold text-gray-300">تولید دستی کد فعال‌سازی ۳۰ روزه:</label>
      <select id="newTokenTier" onchange="generateRandomCode()" class="w-full bg-[#0b0f17] border border-[#232f46] rounded-xl px-3 py-2 text-xs text-white"><option value="pro">اشتراک Pro</option><option value="ultra">اشتراک Ultra</option></select>
      <div class="flex flex-col sm:flex-row gap-2">
        <input id="newTokenInput" type="text" readonly placeholder="روی دکمه تولید کلیک کنید..." class="flex-1 bg-[#0b0f17] border border-[#232f46] rounded-xl px-3.5 py-2.5 text-sm text-amber-400 font-mono focus:outline-none text-left" dir="ltr">
        <input id="newTokenNote" type="text" placeholder="توضیح اختیاری (مثلاً نام یا موبایل کاربر)" class="flex-1 bg-[#0b0f17] border border-[#232f46] rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500">
        <div class="flex gap-2">
          <button onclick="generateRandomCode()" class="bg-gray-700 hover:bg-gray-600 text-white font-bold px-3.5 py-2.5 rounded-xl text-xs transition shrink-0 cursor-pointer">🎲 رندوم</button>
          <button onclick="createToken()" class="bg-amber-500 hover:bg-amber-400 text-black font-bold px-4 py-2.5 rounded-xl text-xs sm:text-sm transition shrink-0 shadow-md cursor-pointer">ثبت کد در سیستم</button>
        </div>
      </div>
    </div>

    <!-- فهرست مستقل کدهای Pro و Ultra -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <section class="space-y-2 min-w-0">
        <div class="flex items-center justify-between text-xs text-gray-400 px-1">
          <span class="font-bold text-amber-300">🔑 کاربران و کدهای Pro</span><span id="proTokenCount">۰ کد</span>
        </div>
        <div class="max-h-96 overflow-y-auto border border-amber-500/20 rounded-2xl p-3 space-y-2 bg-[#0b0f17]/60" id="proTokenList"></div>
      </section>
      <section class="space-y-2 min-w-0">
        <div class="flex items-center justify-between text-xs text-gray-400 px-1">
          <span class="font-bold text-fuchsia-300">🍍 کاربران و کدهای Ultra</span><span id="ultraTokenCount">۰ کد</span>
        </div>
        <div class="max-h-96 overflow-y-auto border border-fuchsia-500/20 rounded-2xl p-3 space-y-2 bg-[#0b0f17]/60" id="ultraTokenList"></div>
      </section>
    </div>

      </div>

  <script>
    let pass = "";

    function makeRandomCodeString(tier = document.getElementById('newTokenTier')?.value || 'pro') {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      let result = tier === 'ultra' ? 'ULTRA-' : 'PRO-';
      for (let i = 0; i < 8; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }

    function generateRandomCode() {
      const tier = document.getElementById('newTokenTier')?.value || 'pro';
      document.getElementById('newTokenInput').value = makeRandomCodeString(tier);
    }

    // تغییر منطق لاگین برای پشتیبانی از کپچا و هندل کردن خطای لاکت شدن
    async function checkLogin() {
      pass = document.getElementById('adminPassInput').value.trim();
      if (!pass) return alert('رمز عبور را وارد کنید!');

      const captchaToken = typeof grecaptcha !== 'undefined' ? grecaptcha.getResponse() : '';
      const siteKeyElement = document.querySelector('.g-recaptcha').getAttribute('data-sitekey');
      
      // فقط زمانی که Site Key را تنظیم کرده‌اید، سمت فرانت هم اجبار کند
      if (siteKeyElement !== 'YOUR_RECAPTCHA_SITE_KEY' && !captchaToken) {
        return alert('لطفاً تیک من ربات نیستم (کپچا) را بزنید.');
      }

      try {
        const res = await fetch('/api/admin', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'X-Admin-Password': pass 
          },
          body: JSON.stringify({ action: 'login', captchaToken })
        });
        
        const data = await res.json().catch(() => ({}));

        if (res.ok) {
          pass = '';
          document.getElementById('loginBox').classList.add('hidden');
          document.getElementById('panelBox').classList.remove('hidden');
          loadAdminData();
          generateRandomCode();
        } else {
          // نمایش دقیق خطای سرور (مثلاً ارور 429 مسدود شدن یا 401 رمز اشتباه)
          alert(data.error || 'خطا در ورود به پنل!');
          if (typeof grecaptcha !== 'undefined') grecaptcha.reset(); // رفرش کپچا برای تلاش مجدد
        }
      } catch (err) {
        alert('خطا در برقراری ارتباط با سرور.');
      }
    }

    async function adminLogout() {
      try {
        await fetch('/api/admin', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'logout'}) });
      } finally {
        pass = '';
        document.getElementById('panelBox').classList.add('hidden');
        document.getElementById('loginBox').classList.remove('hidden');
        alert('از پنل مدیریت خارج شدید.');
      }
    }

    async function loadAdminData() {
      try {
        const res = await fetch('/api/admin', { headers: { 'X-Admin-Password': pass } });
        if (res.status === 401 || res.status === 429) {
          document.getElementById('panelBox').classList.add('hidden');
          document.getElementById('loginBox').classList.remove('hidden');
          return;
        }
        if (!res.ok) return;
        const data = await res.json();
        renderPayments(data.payments || []);
        renderTokens(data.tokens || []);
      } catch (e) { console.error(e); }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('/api/admin', { headers: { 'X-Admin-Password': pass } });
        if (res.ok) {
          document.getElementById('loginBox').classList.add('hidden');
          document.getElementById('panelBox').classList.remove('hidden');
          generateRandomCode();
          const data = await res.json();
          renderPayments(data.payments || []);
          renderTokens(data.tokens || []);
        }
      } catch (e) { console.warn('Admin session check failed', e); }
    });

    function renderPayments(payments) {
      const payEl = document.getElementById('paymentList');
      const pendingCount = payments.filter(p => p.status !== 'done').length;
      const badge = document.getElementById('pendingCountBadge');
      badge.innerText = `${pendingCount} در انتظار بررسی`;
      badge.className = pendingCount > 0 
        ? "px-2.5 py-0.5 rounded-full bg-rose-500/20 text-rose-400 border border-rose-500/30 text-[11px] font-bold"
        : "px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[11px] font-bold";

      if (payments.length === 0) {
        payEl.innerHTML = '<p class="text-xs text-gray-500 text-center py-6">هنوز هیچ فرم پرداختی ثبت نشده است.</p>';
        return;
      }

      payEl.innerHTML = payments.map(p => {
        const dateStr = new Date(p.created || Date.now()).toLocaleString('fa-IR');
        const planName = p.tier === 'ultra' ? 'Ultra' : 'Pro';
        const isDone = p.status === 'done';
        const statusBadge = isDone
          ? `<span class="px-2.5 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 text-[10px] font-bold">✅ کد ارسال شد ${p.assignedToken ? `(${p.assignedToken})` : ''}</span>`
          : `<span class="px-2.5 py-0.5 rounded-full bg-amber-500/15 text-amber-400 border border-amber-500/30 text-[10px] font-bold">⏳ در انتظار صدور کد</span>`;

        return `
          <div class="bg-[#151c28] border ${isDone ? 'border-[#232f46] opacity-75' : 'border-amber-500/40'} p-3.5 rounded-2xl flex flex-col md:flex-row items-start md:items-center justify-between gap-3 text-xs">
            <div class="space-y-1.5">
              <div class="flex flex-wrap items-center gap-2">
                <span class="font-extrabold text-white text-sm">👤 ${p.fullName}</span>
                ${statusBadge}
                <span class="text-[11px] text-gray-400">🕒 ${dateStr} · پلن ${planName}</span>
              </div>
              <div class="flex flex-wrap items-center gap-4 text-gray-300 pt-0.5">
                <span>📱 موبایل: <b dir="ltr" class="font-mono text-emerald-400 select-all">${p.phone}</b></span>
                <span>💳 کارت مبدا: <b dir="ltr" class="font-mono text-amber-300 select-all">${p.senderCard}</b></span>
                <span>💰 مبلغ: <b>${p.amount || '450.000 تومان'}</b></span>
              </div>
            </div>
            <div class="flex flex-wrap items-center gap-2 w-full md:w-auto justify-end shrink-0">
              ${!isDone ? `
                <button onclick="issueCodeForPayment('${p.id}', '${p.fullName}', '${p.phone}', '${p.tier === 'ultra' ? 'ultra' : 'pro'}')" class="px-3 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-extrabold text-[11px] transition cursor-pointer shadow">
                  ⚡ صدور خودکار
                </button>
              ` : ''}
              <button onclick="togglePaymentStatus('${p.id}')" class="px-2.5 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 text-[11px] transition cursor-pointer">
                ${isDone ? 'بازگردانی به انتظار' : '✔ تیک انجام شد'}
              </button>
              <button onclick="deleteKey('${p.id}')" class="px-2.5 py-2 rounded-xl bg-rose-500/15 hover:bg-rose-500/25 text-rose-400 border border-rose-500/30 text-[11px] transition cursor-pointer">
                🗑️ حذف
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderTokens(tokens) {
      const proTokens = tokens.filter(t => !(t.data?.tier === 'ultra' || t.name.startsWith('ULTRA-')));
      const ultraTokens = tokens.filter(t => t.data?.tier === 'ultra' || t.name.startsWith('ULTRA-'));
      const renderList = (items, elementId, countId, emptyText) => {
        const listEl = document.getElementById(elementId);
        document.getElementById(countId).textContent = `${items.length.toLocaleString('fa-IR')} کد`;
        if (!items.length) { listEl.innerHTML = `<p class="text-xs text-gray-500 text-center py-6">${emptyText}</p>`; return; }
        const now = Date.now(), duration = 30 * 86400000;
        listEl.innerHTML = items.map(t => {
          const expiry = (t.data.created || now) + duration, left = expiry - now;
          let remaining = 'منقضی شده', badge = 'text-red-400 bg-red-500/10 border-red-500/30';
          if (left > 0) {
            remaining = `${Math.floor(left / 86400000)} روز و ${Math.floor((left % 86400000) / 3600000)} ساعت باقی‌مانده`;
            badge = 'text-emerald-400 bg-emerald-500/10 border-emerald-500/30';
          }
          const safeName = t.name.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          const safeNote = String(t.data.note || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          return `<div class="flex items-center justify-between gap-2 bg-[#151c28] border border-[#232f46] px-3 py-2.5 rounded-xl text-xs">
            <div class="min-w-0"><div class="flex flex-wrap items-center gap-2"><span class="font-mono text-amber-400 font-bold text-sm tracking-wide select-all" dir="ltr">${safeName}</span>${safeNote ? `<span class="text-gray-300">${safeNote}</span>` : ''}</div>
            <p class="text-[11px] text-gray-400 mt-1">انقضا: ${new Date(expiry).toLocaleDateString('fa-IR')}</p></div>
            <div class="flex items-center gap-2 shrink-0"><span class="px-2 py-1 rounded-full border text-[10px] ${badge}">${remaining}</span>
            <button onclick="deleteKey('${safeName}')" title="حذف کد" class="p-1.5 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20">🗑️</button></div></div>`;
        }).join('');
      };
      renderList(proTokens, 'proTokenList', 'proTokenCount', 'هنوز کد Pro ساخته نشده است');
      renderList(ultraTokens, 'ultraTokenList', 'ultraTokenCount', 'هنوز کد Ultra ساخته نشده است');
    }
    async function issueCodeForPayment(paymentId, fullName, phone, tier = 'pro') {
      const newCode = makeRandomCodeString(tier);
      const createRes = await fetch('/api/admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Password': pass },
        body: JSON.stringify({ token: newCode, note: `${fullName} - ${phone}`, tier })
      });

      if (!createRes.ok) return alert('خطا در ساخت کد پرو!');

      const assignRes = await fetch('/api/admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Password': pass },
        body: JSON.stringify({ action: 'assignPaymentToken', id: paymentId, assignedToken: newCode })
      });
      if (!assignRes.ok) {
        alert(`کد ${newCode} ساخته شد، اما اتصال آن به سفارش ناموفق بود. کد را ذخیره کنید و سفارش را بررسی کنید.`);
        await loadAdminData();
        return;
      }

      const smsText = `${fullName} عزیز، پرداخت شما تایید شد.\nکد فعال‌سازی اشتراک ۳۰ روزه آناناس ${tier === 'ultra' ? 'Ultra' : 'Pro'}:\n${newCode}\nاین کد را در بخش مدیریت اشتراک پرو در محیط چت وارد نمایید.🍍`;
      try {
        await navigator.clipboard.writeText(smsText);
        alert(`✅ کد ${newCode} ساخته شد و متن پیامک در کلیپ‌بورد کپی گردید!`);
      } catch {
        alert(`✅ کد ساخته شد: ${newCode}`);
      }
      loadAdminData();
    }

    async function togglePaymentStatus(id) {
      await fetch('/api/admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Password': pass },
        body: JSON.stringify({ action: 'togglePayment', id })
      });
      loadAdminData();
    }

    async function deleteKey(key) {
      if (!confirm('آیا از حذف این مورد مطمئن هستید؟')) return;
      await fetch('/api/admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Password': pass },
        body: JSON.stringify({ action: 'deleteKey', key })
      });
      loadAdminData();
    }

    async function createToken() {
      const token = document.getElementById('newTokenInput').value.trim();
      const note = document.getElementById('newTokenNote').value.trim();
      const tier = document.getElementById('newTokenTier')?.value || (token.startsWith('ULTRA-') ? 'ultra' : 'pro');
      if (!token) return alert('ابتدا یک کد رندوم تولید کنید');
      
      const res = await fetch('/api/admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Password': pass },
        body: JSON.stringify({ token, note, tier })
      });
      
      if (res.ok) {
        document.getElementById('newTokenNote').value = '';
        loadAdminData();
        generateRandomCode();
        alert(`کد فعال‌سازی ${tier === 'ultra' ? 'Ultra' : 'Pro'} با موفقیت ساخته شد!`);
      } else {
        alert('خطا در ساخت کد. لطفاً دوباره تلاش کنید.');
      }
    }
  </script>
</body>
</html>
